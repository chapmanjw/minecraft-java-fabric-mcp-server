# Root project properties — values here apply to every Stonecutter version subproject
# unless overridden by versions/<ver>/gradle.properties.

# Gradle daemon / JVM configuration. -Xmx3G is the lower bound Loom recommends for
# the remapper + dev launch tasks.
org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.warning.mode=summary

# Lazy subproject configuration so building one Stonecutter version doesn't
# force configuring the others — important when 26.1.x and 1.21.x need
# incompatible Loom plugins (see build.gradle.kts header for context).
org.gradle.configureondemand=true

# Tell Gradle's toolchain locator to honour JDK installations exposed via the
# JAVA_HOME / JDK_<n>_HOME environment variables (set by actions/setup-java in
# CI, and by Corretto's Windows installer in development). This avoids the
# need to ship absolute paths in the checked-in properties file.
org.gradle.java.installations.fromEnv=JDK_21,JDK_25,JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Java toolchain — spec hard constraint is Java 21 minimum. Loom 1.15+ supports 21+.
# Note: named with `toolchain` suffix to avoid colliding with the JVM system property
# named `java.version` (which the property() lookup would otherwise resolve to "25").
java.toolchain.version=21

# Mod identity. Keep these in sync with src/main/resources/fabric.mod.json — the
# fabric.mod.json placeholders are templated from these properties at build time.
mod.id=minecraft_fabric_mcp
mod.group=com.chapmanjw.mcpserver
mod.version=0.4.0
mod.name=Minecraft Java MCP Server
mod.description=Hosts a Model Context Protocol server inside Minecraft for AI agent control.
mod.author=John Chapman (chapmanjw)
mod.license=MIT
mod.homepage=https://github.com/chapmanjw/minecraft-java-fabric-mcp-server
mod.sources=https://github.com/chapmanjw/minecraft-java-fabric-mcp-server
mod.issues=https://github.com/chapmanjw/minecraft-java-fabric-mcp-server/issues

# Jackson — pinned and shaded into our mod jar so we don't share a version with
# any other mod's bundled copy.
deps.jackson=2.18.6

# SLF4J version Minecraft ships with on the supported targets.
deps.slf4j=2.0.9

# Stonecutter plugin version (kept in sync with settings.gradle.kts).
deps.stonecutter=0.9.4

# Default Fabric Loom version. Per-version subprojects may override this.
# 1.16-SNAPSHOT matches Fabric's official 26.1.x example mod.
deps.loom=1.16-SNAPSHOT
