# Per-version coordinates for Minecraft 26.2. Overrides the root gradle.properties
# for this Stonecutter subproject only.

deps.minecraft=26.2
deps.fabric_loader=0.19.3
deps.fabric_api=0.155.2+26.2

# 26.1+ ships unobfuscated, so LoomNoRemap consumes the JAR as-is and the `mappings`
# configuration does not exist. See mod-build.gradle.kts for how this is handled.
deps.mappings_type=mojmap_native
deps.loom=1.16-SNAPSHOT

java.toolchain.version=25
