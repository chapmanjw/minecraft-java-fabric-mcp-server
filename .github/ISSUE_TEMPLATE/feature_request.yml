name: Feature request
description: A new tool, a tool surface improvement, a configuration option.
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem are you trying to solve? What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        Sketch the tool name, the inputs, and what it should return. If you have
        a vanilla command equivalent, name it — many tools dispatch through Brigadier.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
