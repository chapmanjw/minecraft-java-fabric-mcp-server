name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Spotless + Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25 (required for the 26.1.x targets the daemon configures)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check (every Stonecutter target)
        run: ./gradlew ":1.21.11:spotlessCheck" ":26.1.1:spotlessCheck" ":26.1.2:spotlessCheck"

      - name: Checkstyle (every Stonecutter target)
        run: |
          ./gradlew ":1.21.11:checkstyleMain" ":1.21.11:checkstyleTest" \
            ":26.1.1:checkstyleMain" ":26.1.1:checkstyleTest" \
            ":26.1.2:checkstyleMain" ":26.1.2:checkstyleTest"

      - name: Verify required files exist
        run: |
          test -f LICENSE
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/architecture.md
          test -f docs/tools.md
          test -f docs/security.md
          test -f docs/configuration.md
          test -f docs/version-compatibility.md
          test -f mod-build.gradle.kts
          test -f versions/1.21.11/build.gradle.kts
          test -f versions/26.1.1/build.gradle.kts
          test -f versions/26.1.2/build.gradle.kts

      - name: PowerShell scripts are ASCII-only
        # PowerShell 5.1 reads .ps1 files as Windows-1252 unless a UTF-8 BOM is
        # present. Multi-byte UTF-8 chars (em-dashes, arrows, smart quotes) get
        # reinterpreted as garbage bytes and silently break the parser with
        # baffling error messages. Hard-fail any non-ASCII byte in a .ps1.
        # Pure ASCII is a subset of every encoding PS supports, so this is the
        # cheapest rule that prevents the failure mode entirely.
        run: |
          python3 - <<'PY'
          import pathlib, sys
          offenders = []
          for path in pathlib.Path('.').rglob('*.ps1'):
              try:
                  path.read_text(encoding='ascii')
              except UnicodeDecodeError as e:
                  offenders.append((str(path), e.reason, e.start))
          if offenders:
              print('::error::Non-ASCII bytes found in PowerShell scripts:')
              for p, reason, pos in offenders:
                  print(f'  {p} (byte {pos}: {reason})')
              print()
              print('PowerShell 5.1 misparses these files. Replace non-ASCII chars')
              print('with ASCII equivalents (e.g. -- for em-dash, -> for arrow,')
              print('straight ASCII quotes for smart quotes).')
              sys.exit(1)
          print('All .ps1 files are ASCII-only.')
          PY
