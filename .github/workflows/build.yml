name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Minecraft target ships against a specific JDK toolchain. We install
          # both JDKs on every job so Gradle's toolchain locator can pick the right
          # one regardless of which subproject the matrix entry targets.
          - minecraft: "1.21.11"
            jdk: 21
          - minecraft: "26.1.1"
            jdk: 25
          - minecraft: "26.1.2"
            jdk: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (toolchain target for 1.21.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25 (toolchain target for 26.1.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          # JDK 25 is installed second so it ends up first on PATH — Gradle's
          # daemon runs on JDK 25, which can configure 26.1.x's strict version
          # check while still being able to compile 1.21.11 via toolchain.
          java-version-file: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build :${{ matrix.minecraft }}:build
        run: ./gradlew ":${{ matrix.minecraft }}:build" --no-daemon --stacktrace

      - name: Run :${{ matrix.minecraft }}:test
        run: ./gradlew ":${{ matrix.minecraft }}:test" --no-daemon --stacktrace

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-fabric-mcp-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-dev.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
          if-no-files-found: warn

  # Aggregate fan-out that runs Stonecutter's chiseledBuild — a single Gradle
  # invocation that builds every version. This guards against subprojects that
  # accidentally drift apart even when each builds in isolation.
  chiseled:
    name: chiseledBuild (full matrix)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: chiseledBuild
        run: ./gradlew chiseledBuild --no-daemon --stacktrace
