name: diag-curseforge-versions

# Read-only diagnostic: query CurseForge's upload-API game-version list with the
# existing CURSEFORGE_TOKEN and report whether the MC versions this mod targets
# (and the Client/Server environment tags) are recognised. Publishes nothing.
# Manual-trigger only. Safe to delete once the release publish config is settled.

on:
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: Query CurseForge game versions
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then echo "::error::CURSEFORGE_TOKEN not set"; exit 1; fi
          curl -fsS -H "X-Api-Token: ${CF_TOKEN}" https://minecraft.curseforge.com/api/game/version-types -o types.json
          curl -fsS -H "X-Api-Token: ${CF_TOKEN}" https://minecraft.curseforge.com/api/game/versions -o versions.json
          echo "=== version-type count ==="; jq 'length' types.json
          echo "=== version-types mentioning Minecraft / Environment / Java ==="
          jq -r '.[] | select(.name|test("Minecraft|Environment|Java|Side";"i")) | "typeID=\(.id)\tname=\(.name)\tslug=\(.slug)"' types.json
          echo "=== total game-version entries ==="; jq 'length' versions.json
          for v in "26.1.2" "26.1.1" "1.21.11" "1.21.10" "1.21.8" "Client" "Server"; do
            n=$(jq -r --arg v "$v" '[.[] | select(.name==$v)] | length' versions.json)
            echo "--- name '$v': $n exact match(es) ---"
            jq -r --arg v "$v" '.[] | select(.name==$v) | "  id=\(.id) typeID=\(.gameVersionTypeID)"' versions.json | head -5
          done
          echo "=== newest 25 game-version entries (by id) ==="
          jq -r 'sort_by(.id) | reverse | .[0:25][] | "id=\(.id)\ttypeID=\(.gameVersionTypeID)\tname=\(.name)"' versions.json
